<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fear Women Association – Admission Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>Fear Women Association</h2>
        <p class="subtitle">Membership Admission Form</p>

        <form action="https://https://formspree.io/f/mkozanpv" method="POST">

            <!-- Redirect after submit -->
            <input type="hidden" name="_next" 
                   value="https://chvmpbwoy-ops.github.io/fear-women-association-portal/thankyou.html">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="location">Location</label>
            <input type="text" id="location" name="location" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select</option>
                <option>Female</option>
                <option>Male</option>
            </select>

            <label for="reason">Why do you want to join?</label>
            <textarea id="reason" name="reason" rows="4"></textarea>

            <button type="submit">Submit Application</button>

        </form>
    </div>

</body>
</html>
